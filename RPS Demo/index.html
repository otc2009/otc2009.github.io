<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            z-index: -1;
        }

        .background-layer.active {
            opacity: 1;
        }

        #bg1 {
            background-image: url('rock.jpg');
        }

        #bg2 {
            background-image: url('paper.jpeg');
        }

        #bg3 {
            background-image: url('scissors.webp');
        }

        #canvas {
            cursor: pointer;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="bg1" class="background-layer active"></div>
    <div id="bg2" class="background-layer"></div>
    <div id="bg3" class="background-layer"></div>

    <canvas id="canvas"></canvas>
    <button id="resetButton" style="position: fixed; top: 50%; left: calc(50% + 250px); transform: translateY(-50%); padding: 8px 16px; font-size: 12px; font-weight: bold; background-color: #333; color: white; border: 2px solid black; border-radius: 8px; cursor: pointer; z-index: 1000; box-shadow: 3px 3px 10px rgba(0,0,0,0.5);">RESET DEMO</button>

    <script>
        // Background fade animation
        const backgrounds = [
            document.getElementById('bg1'),
            document.getElementById('bg2'),
            document.getElementById('bg3')
        ];
        let currentBgIndex = 0;

        function fadeBackgrounds() {
            // Remove active class from current background
            backgrounds[currentBgIndex].classList.remove('active');

            // Move to next background
            currentBgIndex = (currentBgIndex + 1) % backgrounds.length;

            // Add active class to new background
            backgrounds[currentBgIndex].classList.add('active');
        }

        // Start the background fade cycle (every 5 seconds)
        setInterval(fadeBackgrounds, 5000);
    </script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let currentImage = 'title.png';
        let endScreenIndex = 0; // Track which end screen to show next
        const endScreens = ['errorfr.png', 'rock_wins.png', 'rocks_tie.png', 'paper_winsfr.png', 'papers_tie.png', 'scissors_win.png', 'scissors_tie.png'];
        let titleImg = new Image();
        let titlePressedImg = new Image();
        let pairingImg = new Image();
        let pairedImg = new Image();
        let selectionNoneImg = new Image();
        let selectionRedImg = new Image();
        let selectionYellowImg = new Image();
        let selectionGreenImg = new Image();
        let rockWinsImg = new Image();
        let rocksTieImg = new Image();
        let paperWinsImg = new Image();
        let papersTieImg = new Image();
        let scissorsWinImg = new Image();
        let scissorsTieImg = new Image();
        let errorImg = new Image();

        let cropData = {};
        let unifiedCrop = null; // Unified crop for countdown and result screens
        let imagesLoaded = 0;
        const totalImages = 15;
        let fadeAlpha = 1; // For fade transitions
        let isTransitioning = false;

        // Load images
        titleImg.src = 'title.png';
        titlePressedImg.src = 'title_pressed.png';
        pairingImg.src = 'pairing.png';
        pairedImg.src = 'pairedfr.png';
        selectionNoneImg.src = 'realselection_none.png';
        selectionRedImg.src = 'realselection_3.png';
        selectionYellowImg.src = 'realselection_2.png';
        selectionGreenImg.src = 'realselection_1.png';
        rockWinsImg.src = 'rock_wins.png';
        rocksTieImg.src = 'rocks_tie.png';
        paperWinsImg.src = 'paper_winsfr.png';
        papersTieImg.src = 'papers_tie.png';
        scissorsWinImg.src = 'scissors_win.png';
        scissorsTieImg.src = 'scissors_tie.png';
        errorImg.src = 'errorfr.png';

        // Function to detect black borders and calculate crop area
        function detectBlackBorders(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);

            const imageData = tempCtx.getImageData(0, 0, img.width, img.height);
            const data = imageData.data;

            const threshold = 20; // Pixels darker than this are considered black

            // Find top border
            let top = 0;
            for (let y = 0; y < img.height; y++) {
                let hasNonBlack = false;
                for (let x = 0; x < img.width; x++) {
                    const i = (y * img.width + x) * 4;
                    if (data[i] > threshold || data[i+1] > threshold || data[i+2] > threshold) {
                        hasNonBlack = true;
                        break;
                    }
                }
                if (hasNonBlack) {
                    top = y;
                    break;
                }
            }

            // Find bottom border
            let bottom = img.height;
            for (let y = img.height - 1; y >= 0; y--) {
                let hasNonBlack = false;
                for (let x = 0; x < img.width; x++) {
                    const i = (y * img.width + x) * 4;
                    if (data[i] > threshold || data[i+1] > threshold || data[i+2] > threshold) {
                        hasNonBlack = true;
                        break;
                    }
                }
                if (hasNonBlack) {
                    bottom = y + 1;
                    break;
                }
            }

            // Find left border
            let left = 0;
            for (let x = 0; x < img.width; x++) {
                let hasNonBlack = false;
                for (let y = 0; y < img.height; y++) {
                    const i = (y * img.width + x) * 4;
                    if (data[i] > threshold || data[i+1] > threshold || data[i+2] > threshold) {
                        hasNonBlack = true;
                        break;
                    }
                }
                if (hasNonBlack) {
                    left = x;
                    break;
                }
            }

            // Find right border
            let right = img.width;
            for (let x = img.width - 1; x >= 0; x--) {
                let hasNonBlack = false;
                for (let y = 0; y < img.height; y++) {
                    const i = (y * img.width + x) * 4;
                    if (data[i] > threshold || data[i+1] > threshold || data[i+2] > threshold) {
                        hasNonBlack = true;
                        break;
                    }
                }
                if (hasNonBlack) {
                    right = x + 1;
                    break;
                }
            }

            return {
                x: left,
                y: top,
                width: right - left,
                height: bottom - top
            };
        }

        // Wait for title image to load to set canvas size
        titleImg.onload = function() {
            cropData['title.png'] = detectBlackBorders(titleImg);
            // Make canvas thinner (60% width, 72% height)
            canvas.width = cropData['title.png'].width * 0.6;
            canvas.height = cropData['title.png'].height * 0.72;
            drawCurrentImage();
        };

        titlePressedImg.onload = function() {
            cropData['title_pressed.png'] = detectBlackBorders(titlePressedImg);
        };

        pairingImg.onload = function() {
            cropData['pairing.png'] = detectBlackBorders(pairingImg);
        };

        pairedImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        // Calculate unified crop area for all selection/result screens
        function calculateUnifiedCrop() {
            const crops = [
                detectBlackBorders(selectionNoneImg),
                detectBlackBorders(selectionRedImg),
                detectBlackBorders(selectionYellowImg),
                detectBlackBorders(selectionGreenImg),
                detectBlackBorders(rockWinsImg),
                detectBlackBorders(rocksTieImg),
                detectBlackBorders(paperWinsImg),
                detectBlackBorders(papersTieImg),
                detectBlackBorders(scissorsWinImg),
                detectBlackBorders(scissorsTieImg),
                detectBlackBorders(errorImg),
                detectBlackBorders(pairedImg)
            ];

            // Find the maximum bounds that fit all images
            let minX = Math.min(...crops.map(c => c.x));
            let minY = Math.min(...crops.map(c => c.y));
            let maxRight = Math.max(...crops.map(c => c.x + c.width));
            let maxBottom = Math.max(...crops.map(c => c.y + c.height));

            unifiedCrop = {
                x: minX,
                y: minY,
                width: maxRight - minX,
                height: maxBottom - minY
            };

            // Use unified crop for all these screens
            cropData['realselection_none.png'] = unifiedCrop;
            cropData['realselection_3.png'] = unifiedCrop;
            cropData['realselection_2.png'] = unifiedCrop;
            cropData['realselection_1.png'] = unifiedCrop;
            cropData['rock_wins.png'] = unifiedCrop;
            cropData['rocks_tie.png'] = unifiedCrop;
            cropData['paper_winsfr.png'] = unifiedCrop;
            cropData['papers_tie.png'] = unifiedCrop;
            cropData['scissors_win.png'] = unifiedCrop;
            cropData['scissors_tie.png'] = unifiedCrop;
            cropData['errorfr.png'] = unifiedCrop;
            cropData['pairedfr.png'] = unifiedCrop;
        }

        selectionNoneImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        selectionRedImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        selectionYellowImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        selectionGreenImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        rockWinsImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        rocksTieImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        paperWinsImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        papersTieImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        scissorsWinImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        scissorsTieImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        errorImg.onload = function() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) calculateUnifiedCrop();
        };

        function drawCurrentImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let img, crop;
            if (currentImage === 'title.png') {
                img = titleImg;
                crop = cropData['title.png'];
            } else if (currentImage === 'title_pressed.png') {
                img = titlePressedImg;
                crop = cropData['title_pressed.png'];
            } else if (currentImage === 'pairing.png') {
                img = pairingImg;
                crop = cropData['pairing.png'];
            } else if (currentImage === 'pairedfr.png') {
                img = pairedImg;
                crop = cropData['pairedfr.png'];
            } else if (currentImage === 'realselection_none.png') {
                img = selectionNoneImg;
                crop = cropData['realselection_none.png'];
            } else if (currentImage === 'realselection_3.png') {
                img = selectionRedImg;
                crop = cropData['realselection_3.png'];
            } else if (currentImage === 'realselection_2.png') {
                img = selectionYellowImg;
                crop = cropData['realselection_2.png'];
            } else if (currentImage === 'realselection_1.png') {
                img = selectionGreenImg;
                crop = cropData['realselection_1.png'];
            } else if (currentImage === 'rock_wins.png') {
                img = rockWinsImg;
                crop = cropData['rock_wins.png'];
            } else if (currentImage === 'rocks_tie.png') {
                img = rocksTieImg;
                crop = cropData['rocks_tie.png'];
            } else if (currentImage === 'paper_winsfr.png') {
                img = paperWinsImg;
                crop = cropData['paper_winsfr.png'];
            } else if (currentImage === 'papers_tie.png') {
                img = papersTieImg;
                crop = cropData['papers_tie.png'];
            } else if (currentImage === 'scissors_win.png') {
                img = scissorsWinImg;
                crop = cropData['scissors_win.png'];
            } else if (currentImage === 'scissors_tie.png') {
                img = scissorsTieImg;
                crop = cropData['scissors_tie.png'];
            } else if (currentImage === 'errorfr.png') {
                img = errorImg;
                crop = cropData['errorfr.png'];
            }

            if (img && crop) {
                // Apply fade alpha
                ctx.globalAlpha = fadeAlpha;

                // Draw the cropped image
                ctx.drawImage(img, crop.x, crop.y, crop.width, crop.height,
                             0, 0, canvas.width, canvas.height);

                // Reset alpha for border
                ctx.globalAlpha = 1;

                // Add thicker black border that bleeds into the photo
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 8;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
            } else if (img && !crop) {
                // If crop data isn't ready yet, calculate it now
                crop = detectBlackBorders(img);
                cropData[currentImage] = crop;

                // Apply fade alpha
                ctx.globalAlpha = fadeAlpha;

                // Draw the cropped image
                ctx.drawImage(img, crop.x, crop.y, crop.width, crop.height,
                             0, 0, canvas.width, canvas.height);

                // Reset alpha for border
                ctx.globalAlpha = 1;

                // Add thicker black border that bleeds into the photo
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 8;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Function to transition to a new image with fade effect
        function transitionToImage(newImage, duration = 300) {
            if (isTransitioning) return;
            isTransitioning = true;

            const fadeOutDuration = duration / 2;
            const fadeInDuration = duration / 2;
            const fadeOutSteps = 20;
            const fadeInSteps = 20;
            const fadeOutInterval = fadeOutDuration / fadeOutSteps;
            const fadeInInterval = fadeInDuration / fadeInSteps;

            let step = 0;

            // Fade out
            const fadeOut = setInterval(() => {
                step++;
                fadeAlpha = 1 - (step / fadeOutSteps);
                drawCurrentImage();

                if (step >= fadeOutSteps) {
                    clearInterval(fadeOut);
                    // Change image at the midpoint
                    currentImage = newImage;
                    step = 0;

                    // Fade in
                    const fadeIn = setInterval(() => {
                        step++;
                        fadeAlpha = step / fadeInSteps;
                        drawCurrentImage();

                        if (step >= fadeInSteps) {
                            clearInterval(fadeIn);
                            fadeAlpha = 1;
                            isTransitioning = false;
                        }
                    }, fadeInInterval);
                }
            }, fadeOutInterval);
        }

        function resetDemo() {
            currentImage = 'title.png';
            drawCurrentImage();
        }

        // Reset button event listener
        document.getElementById('resetButton').addEventListener('click', resetDemo);

        // Function to start countdown and show end screen
        function startCountdown() {
            currentImage = 'realselection_none.png';
            drawCurrentImage();

            // Automatic transitions through selection screens
            setTimeout(() => {
                currentImage = 'realselection_3.png';
                drawCurrentImage();

                setTimeout(() => {
                    currentImage = 'realselection_2.png';
                    drawCurrentImage();

                    setTimeout(() => {
                        currentImage = 'realselection_1.png';
                        drawCurrentImage();

                        // After countdown, show the current end screen
                        setTimeout(() => {
                            transitionToImage(endScreens[endScreenIndex]);
                        }, 1000);
                    }, 1000);
                }, 1000);
            }, 1000);
        }

        // Handle click events - simple presentation mode
        canvas.addEventListener('click', function(e) {
            if (isTransitioning) return; // Prevent clicks during transitions

            if (currentImage === 'title.png') {
                // Flash the pressed state
                currentImage = 'title_pressed.png';
                drawCurrentImage();

                // Show title_pressed for 1 second, then transition to pairing
                setTimeout(() => {
                    transitionToImage('pairing.png');
                }, 1000);
            } else if (currentImage === 'pairing.png') {
                // Any click on pairing screen goes to paired
                transitionToImage('pairedfr.png');
            } else if (currentImage === 'pairedfr.png') {
                // Start the countdown with fade transition
                transitionToImage('realselection_none.png');

                // Continue countdown after transition
                setTimeout(() => {
                    setTimeout(() => {
                        currentImage = 'realselection_3.png';
                        drawCurrentImage();

                        setTimeout(() => {
                            currentImage = 'realselection_2.png';
                            drawCurrentImage();

                            setTimeout(() => {
                                currentImage = 'realselection_1.png';
                                drawCurrentImage();

                                // After countdown, show the current end screen
                                setTimeout(() => {
                                    transitionToImage(endScreens[endScreenIndex]);
                                }, 1000);
                            }, 1000);
                        }, 1000);
                    }, 1000);
                }, 300); // Wait for initial transition to complete
            } else if (currentImage === 'errorfr.png') {
                // Timeout screen goes straight back to countdown and moves to next end screen
                endScreenIndex = (endScreenIndex + 1) % endScreens.length;
                startCountdown();
            } else if (endScreens.includes(currentImage)) {
                // Move to next end screen
                endScreenIndex = (endScreenIndex + 1) % endScreens.length;

                // If we just finished the last end screen (scissors_tie), go back to title
                // Otherwise, go back to paired screen to play again
                if (currentImage === 'scissors_tie.png') {
                    transitionToImage('title.png');
                } else {
                    transitionToImage('pairedfr.png');
                }
            }
        });
    </script>
</body>
</html>
