<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="mainpage.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <script src="sketch.js"></script>
    <title>Main Page</title>
</head>

<body>
    <div class="page">
        <h1>FlickArt</h1>

        <input type="file" id="imgUpload" accept="image/*">
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button id="resetButton">UPLOAD</button>
            <button id="resetFiltersButton">RESET</button>
            <button id="downloadButton">DOWNLOAD</button>
        </div>
        <div class="decorative-line"></div>
        <div class="slider-container">
            <div class="slider-item">
                <label for="exposureSlider">Exposure: <span id="exposureValue">0</span></label>
                <input type="range" id="exposureSlider" min="-100" max="100" value="0">
            </div>
            <div class="slider-item">
                <label for="pixelateSlider">Pixelate: <span id="pixelateValue">100</span></label>
                <input type="range" id="pixelateSlider" min="0" max="100" value="100">
            </div>
            <div class="slider-item">
                <label for="shimmerSlider">Shimmer: <span id="shimmerValue">0</span></label>
                <input type="range" id="shimmerSlider" min="0" max="100" value="0">
            </div>
            <div class="slider-item">
                <label for="grainSlider">Grain: <span id="grainValue">0</span></label>
                <input type="range" id="grainSlider" min="0" max="100" value="0">
            </div>
        </div>

        <div class="decorative-line" id="bottomLine"></div>

        <div id="resolutionButtons" style="position: fixed; bottom: 30px; left: 30px; z-index:5;">
            <div style="display:flex; gap:5px;">
                <div style="display:flex; flex-direction: column; gap:5px;">
                    <button id="vStretch2" style="width: 65px; height: 65px; font-size: 24px;">▲</button>
                    <button id="vStretch1" style="width: 65px; height: 65px; font-size: 24px;">△</button>
                </div>
                <button id="bwFilter" style="width: 135px; height: 135px; font-size: 18px; font-weight: bold;"></button>
            </div>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button id="center" style="width: 65px; height: 65px; font-size: 24px;">-</button>
                <button id="hStretch1" style="width: 65px; height: 65px; font-size: 24px;">▷</button>
                <button id="hStretch2" style="width: 65px; height: 65px; font-size: 24px;">►</button>
            </div>
        </div>
        <div id="colorSliders" class="slider-container">
            <div class="slider-item" id="redSliderBox">
                <label for="redSlider">R: <span id="redValue">10</span></label>
                <input type="range" id="redSlider" min="0" max="20" value="10" step="1">
            </div>
            <div class="slider-item" id="greenSliderBox">
                <label for="greenSlider">G: <span id="greenValue">10</span></label>
                <input type="range" id="greenSlider" min="0" max="20" value="10" step="1">
            </div>
            <div class="slider-item" id="blueSliderBox">
                <label for="blueSlider">B: <span id="blueValue">10</span></label>
                <input type="range" id="blueSlider" min="0" max="20" value="10" step="1">
            </div>
        </div>
        <div id="colorSliders2" class="slider-container">
            <div class="slider-item" id="yellowSliderBox">
                <label for="yellowSlider">Y: <span id="yellowValue">10</span></label>
                <input type="range" id="yellowSlider" min="0" max="20" value="10" step="1">
            </div>
            <div class="slider-item" id="purpleSliderBox">
                <label for="purpleSlider">P: <span id="purpleValue">10</span></label>
                <input type="range" id="purpleSlider" min="0" max="20" value="10" step="1">
            </div>
            <div class="slider-item" id="pinkSliderBox">
                <label for="pinkSlider">Pi: <span id="pinkValue">10</span></label>
                <input type="range" id="pinkSlider" min="0" max="20" value="10" step="1">
            </div>
        </div>

        <div id="flipButtons" style="position: fixed; bottom: 30px; left: 260px; z-index: 5;">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button id="flipH" style="width: 90px; height: 65px; font-size: 14px; font-weight: bold;">FLIP H</button>
                <button id="flipV" style="width: 90px; height: 65px; font-size: 14px; font-weight: bold;">FLIP V</button>
            </div>
        </div>
    </div>
</body>
</html>
